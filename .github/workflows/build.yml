name: Build Boards

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build ESP32-C3
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build C3 Variant
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          # Build menggunakan nama board C3 yang terdaftar resmi di repo
          python scripts/build.py lichuang-c3-dev

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_esp32c3_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
