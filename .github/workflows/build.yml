name: Build Boards

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build ESP32-C3 Direct IDF
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with ESP-IDF
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          
          # Atur target chip langsung ke esp32c3
          idf.py set-target esp32c3
          
          # Kompilasi langsung proyek tanpa lewat script python
          idf.py build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_esp32c3_direct_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
